# Unit tests (including the generated gate tests), the release gate on the committed
# evaluation reports, and the web app's types and lint. Calls no model: evaluations run
# on the real model before a prompt change is committed (python -m app.evals run).
name: ci

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: pip install -r requirements.txt ruff==0.9.1
      - name: Lint (bug-class rules)
        run: ruff check app tests alembic --select F
      - name: Unit tests and generated gate tests
        run: python -m pytest -q -p no:cacheprovider --ignore=tests/test_release_gate.py
      - name: Release gate (a worse agent version fails here)
        run: python -m pytest -q -p no:cacheprovider tests/test_release_gate.py

  marketplace:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q -p no:cacheprovider

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src
